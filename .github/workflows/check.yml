name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint documents
        run: node tools/lint.mjs
      # The changelog's top entry names the version the release workflow will tag
      - name: Check the release number
        run: |
          top=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          [ -n "$top" ] || { echo "::error::CHANGELOG.md names no version"; exit 1; }
          echo "release v$top"
      - name: Export every bundle
        run: for t in chat site knowledge ai portal; do node tools/export.mjs --target "$t"; done
