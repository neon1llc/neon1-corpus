name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint documents
        run: node tools/lint.mjs
      - name: Export every bundle
        run: for t in chat site knowledge ai; do node tools/export.mjs --target "$t"; done
