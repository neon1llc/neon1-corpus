name: check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lint documents
        run: node tools/lint.mjs
      # The renderer escapes raw HTML and refuses unsafe link schemes
      - name: Test corpus tools
        run: node --test tools/*.test.mjs
      # Every mermaid diagram is drawn, has alt text, and no drawing is left over
      - name: Check diagrams
        run: node tools/diagrams.mjs check
      # The changelog's top entry names the version the release workflow will tag
      - name: Check the release number
        run: |
          top=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          [ -n "$top" ] || { echo "::error::CHANGELOG.md names no version"; exit 1; }
          echo "release v$top"
      - name: Export every bundle
        run: for t in chat site knowledge ai portal blog; do node tools/export.mjs --target "$t"; done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .
